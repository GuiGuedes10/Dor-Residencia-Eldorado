name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate rápido e sem dependências: prova que o fallback em Python puro funciona.
  tests-standalone:
    name: Tiers (Python puro) ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Runner standalone (sem pip install)
        run: python tests/conftest.py

  # Suíte completa com PyTorch/Selenium instalados.
  tests-pytest:
    name: Suíte completa (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pytest
        run: pytest -q

  # Sanidade do JavaScript da extensão e da CLI (sem build).
  lint-js:
    name: JS syntax + JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Checar sintaxe JS
        run: |
          for f in extension/*.js voice-nav-cli/src/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Validar JSON (manifest + modelo de tópicos)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('extension/models/intent.json','utf8'))"
